  /api/v1/prescriptions/{prescriptionId}/cancel:
    parameters:
    - $ref: '#/components/parameters/PrescriptionId'
    post:
      tags:
      - Prescriptions
      operationId: cancelPrescription
      summary: Cancel a prescription that has not been dispensed
      x-roles:
      - DOCTOR
      - PHARMACIST
      x-errors:
      - PRESCRIPTION_NOT_FOUND
      - NOT_RESOURCE_OWNER
      - INVALID_STATUS_TRANSITION
      x-business-rules:
      - Allowed from PENDING or IN_PROGRESS only. DISPENSED and CANCELLED are terminal -> 409 INVALID_STATUS_TRANSITION.
      - A DOCTOR may cancel only prescriptions of consultations they recorded (403 NOT_RESOURCE_OWNER); a PHARMACIST may cancel
        any (e.g. patient never collected, nothing available).
      - reason is mandatory and stored in cancel_reason; it is not copied to the audit log.
      - Cancelling never deletes items; the doctor can re-issue with POST /consultations/{id}/prescriptions.
      x-entities:
      - prescriptions (W)
      - consultations (R)
      - audit_events (W)
      x-concurrency: Row locked FOR UPDATE, status re-checked. Cancel and dispense racing on the same prescription serialise
        on the lock; the second gets 409.
      x-audit:
      - PRESCRIPTION_CANCELLED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPrescriptionRequest'
            example:
              reason: Wrong strength prescribed - re-issuing
