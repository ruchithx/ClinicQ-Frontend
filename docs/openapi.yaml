  /api/v1/prescriptions:
    get:
      tags:
      - Prescriptions
      operationId: listPrescriptions
      summary: List prescriptions (pharmacist queue / doctor's own prescriptions)
      description: |
        PHARMACIST: all prescriptions. DOCTOR: only prescriptions of consultations the caller recorded
        (the server forces prescribedBy = caller; the parameter is ignored for doctors).
        Users with both roles get the pharmacist view. Default filter: status=PENDING,IN_PROGRESS, oldest first.
      x-roles:
      - PHARMACIST
      - DOCTOR
      parameters:
      - name: status
        in: query
        style: form
        explode: true
        description: Repeatable. Default PENDING and IN_PROGRESS.
        schema:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PrescriptionStatus'
      - name: patientNumber
        in: query
        description: Exact patient number (upper-cased by the server).
        schema:
          type: string
          maxLength: 20
      - name: prescriptionNumber
        in: query
        description: Exact prescription number, with or without RX- prefix.
        schema:
          type: string
          pattern: ^(RX-)?[0-9]{1,12}$
      - name: submittedFrom
        in: query
        description: Inclusive lower bound of submittedAt.
        schema:
          type: string
          format: date-time
      - name: submittedTo
        in: query
        description: Exclusive upper bound of submittedAt.
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - submittedAt,asc
          - submittedAt,desc
          default: submittedAt,asc
      - $ref: '#/components/parameters/RequestId'
      x-errors: []
      x-business-rules:
      - Returns summaries only; no clinical notes or diagnoses. Polled by the pharmacist dashboard every NEXT_PUBLIC_PRESCRIPTION_POLL_INTERVAL_MS.
      - List calls are not audited individually (to avoid one audit row per poll); opening a prescription is.
      x-entities:
      - prescriptions (R)
      - patients (R)
      - consultations (R)
      - users (R)
      - prescription_items (R, count)
      - dispensings (R)
      x-concurrency: Read-only. Single query with joins plus a grouped item count (no N+1).
      responses:
        '200':
          description: Page of prescription summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionSummaryPage'
              example:
                items:
                - id: 50000000-0000-4000-8000-000000000002
                  prescriptionNumber: RX-000002
                  consultationId: 40000000-0000-4000-8000-000000000002
                  status: PENDING
                  patient:
                    id: 20000000-0000-4000-8000-000000000001
                    patientNumber: P-0001
                    fullName: Saman Kumara
                  prescribedBy:
                    id: 00000000-0000-4000-8000-000000000002
                    fullName: Dr. Nimal Perera
                  submittedAt: '2026-10-12T03:03:31Z'
                  itemCount: 2
                  startedBy: null
                  dispensingOutcome: null
                  dispensedAt: null
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          description: VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    type: https://dms.example/problems/validation-failed
                    title: Validation failed
                    status: 400
                    detail: One or more fields are invalid.
                    instance: /api/v1/prescriptions
                    code: VALIDATION_FAILED
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
                    errors:
                    - field: fullName
