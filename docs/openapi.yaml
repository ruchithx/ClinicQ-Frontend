      - INTERNAL_ERROR
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      operationId: refreshToken
      summary: Exchange the refresh cookie for a new access token
      description: Rotates the refresh token (old one is marked rotated, a new cookie is set) and returns a new access token.
        Called on page load and whenever an API call returns 401 TOKEN_EXPIRED.
      x-roles:
      - PUBLIC
      security:
      - refreshCookie: []
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/RequestId'
      x-errors:
      - REFRESH_TOKEN_INVALID
      - REFRESH_TOKEN_ROTATED
      - SESSION_REVOKED
      - ACCOUNT_DISABLED
      x-business-rules:
      - Token is looked up by SHA-256 hash; revoked or expired tokens -> 401 REFRESH_TOKEN_INVALID and the cookie is cleared.
      - A token already rotated less than 30 s ago -> 401 REFRESH_TOKEN_ROTATED (no revocation; parallel tab race). Client
        retries once after 500 ms.
      - A token rotated more than 30 s ago -> the whole family is revoked (REUSE_DETECTED) -> 401 SESSION_REVOKED.
      - Disabled users -> family revoked (USER_DISABLED), 401 ACCOUNT_DISABLED.
      - The new token keeps the family's absolute expiry; the cookie Max-Age is the remaining lifetime.
      - Roles are re-read from the database, so role changes take effect at the next refresh (<= 15 min).
      x-entities:
      - refresh_tokens (R/W)
      - users (R)
      - user_roles (R)
      - audit_events (W, reuse only)
      x-concurrency: The presented token row is locked with SELECT ... FOR UPDATE so two simultaneous refreshes with the same
        token cannot both rotate it.
      x-audit:
      - AUTH_REFRESH_REUSE_DETECTED
      responses:
        '200':
          description: New access token issued.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDQifQ.sig
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 00000000-0000-4000-8000-000000000004
                  username: ph.silva
                  fullName: Kamal Silva
                  roles:
                  - PHARMACIST
                  mustChangePassword: false
                  professionalRegistrationNumber: PH-3456
        '401':
          description: REFRESH_TOKEN_INVALID; REFRESH_TOKEN_ROTATED; SESSION_REVOKED; ACCOUNT_DISABLED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                REFRESH_TOKEN_INVALID:
                  summary: Session expired
                  value:
                    type: https://dms.example/problems/refresh-token-invalid
                    title: Session expired
                    status: 401
                    detail: Your session has expired. Please sign in again.
                    instance: /api/v1/auth/refresh
                    code: REFRESH_TOKEN_INVALID
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
                REFRESH_TOKEN_ROTATED:
                  summary: Refresh token already rotated
                  value:
                    type: https://dms.example/problems/refresh-token-rotated
                    title: Refresh token already rotated
                    status: 401
                    detail: Refresh token was already used; retry.
                    instance: /api/v1/auth/refresh
                    code: REFRESH_TOKEN_ROTATED
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
                SESSION_REVOKED:
                  summary: Session revoked
                  value:
                    type: https://dms.example/problems/session-revoked
                    title: Session revoked
                    status: 401
                    detail: This session was revoked for security reasons. Please sign in again.
                    instance: /api/v1/auth/refresh
                    code: SESSION_REVOKED
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
                ACCOUNT_DISABLED:
                  summary: Account disabled
                  value:
                    type: https://dms.example/problems/account-disabled
                    title: Account disabled
                    status: 401
                    detail: This account has been disabled. Contact an administrator.
                    instance: /api/v1/auth/refresh
                    code: ACCOUNT_DISABLED
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '500':
          description: INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  summary: Internal server error
                  value:
                    type: https://dms.example/problems/internal-error
                    title: Internal server error
                    status: 500
                    detail: An unexpected error occurred. Quote request id 7f3c... when reporting.
                    instance: /api/v1/auth/refresh
                    code: INTERNAL_ERROR
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      x-error-codes:
      - REFRESH_TOKEN_INVALID
      - REFRESH_TOKEN_ROTATED
      - SESSION_REVOKED
      - ACCOUNT_DISABLED
      - INTERNAL_ERROR
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Log out and revoke the refresh-token family
      description: Revokes the refresh-token family of the presented cookie and clears the cookie. Always returns 204 (also
        when the cookie is missing or already invalid), so logout is idempotent.
      x-roles:
      - PUBLIC
      security:
      - refreshCookie: []
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      - $ref: '#/components/parameters/RequestId'
      x-errors: []
      x-business-rules:
      - The access token is not required; it simply expires (max 15 min). The frontend discards it from memory immediately.
      x-entities:
      - refresh_tokens (W)
      - audit_events (W)
      x-audit:
      - AUTH_LOGOUT
      responses:
        '204':
          description: Logged out; `Set-Cookie` clears dms_refresh (Max-Age=0).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '500':
          description: INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  summary: Internal server error
                  value:
                    type: https://dms.example/problems/internal-error
                    title: Internal server error
                    status: 500
                    detail: An unexpected error occurred. Quote request id 7f3c... when reporting.
                    instance: /api/v1/auth/logout
                    code: INTERNAL_ERROR
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      x-error-codes:
      - INTERNAL_ERROR
