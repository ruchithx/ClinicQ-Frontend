  /api/v1/consultations:
    post:
      tags:
      - Consultations
      operationId: createConsultation
      summary: Create a consultation with diagnoses and an optional prescription (one transaction)
      description: |
        Persists the consultation, its diagnoses and (when `prescription` is present) the prescription with all items atomically.
        The prescription is created with status PENDING and therefore appears immediately in the pharmacist queue (FR-021).
      x-roles:
      - DOCTOR
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      x-errors:
      - REFERENCED_RESOURCE_NOT_FOUND
      - MEDICINE_INACTIVE
      - QUEUE_ENTRY_ALREADY_LINKED
      - QUEUE_ENTRY_NOT_IN_SESSION
      x-business-rules:
      - doctor = authenticated user; consultationAt = server time. Clients cannot set either.
      - diagnoses 1-10 (line numbers assigned in array order). prescription.items 1-30 (line numbers in array order).
      - An item with medicineId must NOT carry medicineName, strength or dosageForm; the server copies them from the catalogue
        (snapshot). An item without medicineId must carry medicineName (free-text medicine).
      - A referenced catalogue medicine must be active, otherwise 422 MEDICINE_INACTIVE with the item path.
      - queueEntryId (optional) must reference a queue entry in status SERVING or COMPLETED that is not linked to another
        consultation. Linking does not change the queue entry status.
      - Any validation or persistence failure rolls back everything; no partial consultation, diagnosis or prescription is
        ever stored.
      - There is no update or delete endpoint for consultations; history is append-only.
      x-entities:
      - consultations (W)
      - consultation_diagnoses (W)
      - prescriptions (W)
      - prescription_items (W)
      - patients (R)
      - medicines (R)
      - queue_entries (R)
      - idempotency_keys (W)
      - audit_events (W)
      x-concurrency: Single @Transactional service method. Idempotency row inserted first in the same transaction so a double-submitted
        form blocks on the unique key and then replays the first result (201, same consultation).
      x-audit:
      - CONSULTATION_CREATED
      - PRESCRIPTION_CREATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsultationRequest'
            example:
              patientId: 20000000-0000-4000-8000-000000000002
              queueEntryId: 31000000-0000-4000-8000-000000000002
              presentingComplaint: Itchy eyes and sneezing for one week
              clinicalNotes: No fever. Mild conjunctival injection bilaterally.
              diagnoses:
              - conditionText: Allergic rhinitis
                icd10Code: J30.4
              prescription:
                notes: null
                items:
                - medicineId: 10000000-0000-4000-8000-000000000007
                  dose: 1 tablet
                  frequency: Once daily at night (nocte)
                  durationDays: 10
                  quantity: 10
                  quantityUnit: tablets
                  instructions: May cause drowsiness
                - medicineName: Sodium cromoglicate eye drops
                  strength: 2%
                  dosageForm: DROPS
                  dose: 1 drop each eye
                  frequency: 4 times daily (QDS)
                  durationDays: 14
                  quantity: 1
                  quantityUnit: bottle
      responses:
        '201':
          description: Created (or replayed for a repeated Idempotency-Key).
          headers:
            Location:
              description: /api/v1/consultations/{consultationId}
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationResponse'
              example:
                id: 4a7e9d10-1c2b-4f3e-8d5a-0b6c7d8e9f01
                patient:
                  id: 20000000-0000-4000-8000-000000000002
                  patientNumber: P-0002
