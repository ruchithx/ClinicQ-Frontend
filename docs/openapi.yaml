  /api/v1/consultations/{consultationId}/prescriptions:
    parameters:
    - $ref: '#/components/parameters/ConsultationId'
    post:
      tags:
      - Prescriptions
      operationId: addPrescriptionToConsultation
      summary: Add (or re-issue) a prescription for an existing consultation
      description: |
        Used to correct a mistake: the doctor cancels the wrong prescription and issues a replacement with
        `supersedesPrescriptionId`, or adds a prescription to a consultation that had none.
      x-roles:
      - DOCTOR
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      x-errors:
      - CONSULTATION_NOT_FOUND
      - NOT_RESOURCE_OWNER
      - ACTIVE_PRESCRIPTION_EXISTS
      - CONSULTATION_LOCKED
      - INVALID_SUPERSEDED_PRESCRIPTION
      - REFERENCED_RESOURCE_NOT_FOUND
      - MEDICINE_INACTIVE
      x-business-rules:
      - Only the consultation's doctor may add a prescription (403 NOT_RESOURCE_OWNER otherwise).
      - Allowed only within 24 hours of consultationAt (422 CONSULTATION_LOCKED).
      - The consultation must have no non-cancelled prescription (409 ACTIVE_PRESCRIPTION_EXISTS).
      - supersedesPrescriptionId, when given, must be a CANCELLED prescription of this consultation that is not already superseded.
      - Item rules are identical to createConsultation.
      x-entities:
      - prescriptions (W)
      - prescription_items (W)
      - consultations (R)
      - medicines (R)
      - idempotency_keys (W)
      - audit_events (W)
      x-concurrency: The partial unique index uq_prescriptions_active_per_consultation guarantees at most one active prescription
        even under concurrent requests; a violation maps to 409 ACTIVE_PRESCRIPTION_EXISTS.
      x-audit:
      - PRESCRIPTION_CREATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPrescriptionRequest'
            example:
              supersedesPrescriptionId: 50000000-0000-4000-8000-000000000002
              notes: Corrected Metformin quantity
              items:
              - medicineId: 10000000-0000-4000-8000-000000000005
                dose: 1 tablet
                frequency: Twice daily (BD)
                durationDays: 30
                quantity: 60
                quantityUnit: tablets
                instructions: With meals
      responses:
