# Dispensary Management System - OpenAPI 3.1 contract (release 1.0)
# GENERATED from build/openapi/*.yaml + error/audit catalogues. Canonical API contract;
# keep in sync with 03-REST-API-Documentation.pdf (generated from this file).
openapi: 3.1.0
info:
  title: Dispensary Management System API
  version: 1.0.0
  summary: REST API for patient records, consultations, prescriptions, dispensing and queue management.
  description: |
    Contract for release 1.0 of the Dispensary Management System (DMS).

    * All business endpoints live under `/api/v1`. Health checks live under `/actuator`.
    * JSON only (`application/json`); errors use RFC 9457 Problem Details (`application/problem+json`).
    * Authentication: short-lived JWT access token in `Authorization: Bearer`, plus an opaque, rotating
      refresh token in the HttpOnly cookie `dms_refresh` (path `/api/v1/auth`).
    * Roles: `ADMIN`, `DOCTOR`, `PHARMACIST`. Each operation lists its roles in `x-roles`
      (`PUBLIC` = no authentication, `ANY_STAFF` = any authenticated user).
    * Identifiers are UUIDs. Human identifiers: `patientNumber` (e.g. `P-0001`), `prescriptionNumber`
      (`RX-000123`), `queueNumber` (1-999 per queue session).
    * Instants are ISO-8601 UTC (`2026-10-12T04:15:00Z`). Business dates (`sessionDate`, `dateOfBirth`)
      are `YYYY-MM-DD` in the dispensary time zone (`APP_TIMEZONE`).
    * Decimal quantities are JSON numbers with at most 2 decimal places (Java `BigDecimal`).
    * Collections are paginated: `page` (0-based, default 0) and `size` (1-100, default 20);
      responses use the `...Page` envelope `{items, page, size, totalItems, totalPages}`.
    * Create operations marked `x-idempotency: required` need an `Idempotency-Key` header; a retry with the
      same key and body returns the original result instead of creating a duplicate.

    This file is the canonical contract. The backend's generated `/v3/api-docs` must match its paths,
    methods, schemas and status codes; the frontend's TypeScript types are generated from this file.
  contact:
    name: DMS project team
  license:
    name: Proprietary - internal use
    identifier: LicenseRef-Proprietary
servers:
- url: http://localhost:8080
  description: Backend directly (local development)
- url: http://localhost:3000
  description: Through the Next.js rewrite proxy (local development, same-origin)
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Login, token refresh, logout, current user, password change.
- name: Users and staff
  description: Staff account administration (ADMIN) and a minimal staff directory.
- name: Patients
  description: Patient lookup, search, registration and demographic updates.
- name: Medical history
  description: Read-only aggregated history of a patient's consultations, conditions and prescriptions.
- name: Consultations
  description: Creating and reading consultations (diagnoses, notes and the initial prescription in one transaction).
- name: Prescriptions
  description: Listing, reading, cancelling and re-issuing prescriptions. Prescription items are created only as part of a
    prescription and have no endpoints of their own.
- name: Pharmacy and dispensing
  description: Pharmacist workflow - start and dispense.
- name: Medicines
  description: Lightweight medicine catalogue (no inventory).
- name: Bookings
  description: Creating and cancelling bookings. A booking is a queue entry created on behalf of a patient (telephone or walk-in).
- name: Queue management
  description: Queue sessions and queue-entry transitions (call, complete, skip, requeue).
- name: Public queue display
  description: Unauthenticated, privacy-safe queue status for patients and waiting-room screens.
- name: Audit
  description: Read access to the audit trail (ADMIN).
- name: Health checks
  description: Spring Boot Actuator liveness and readiness.
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Log in with username and password
      description: Verifies credentials, issues a 15-minute access token in the body and a refresh token in the `dms_refresh`
        HttpOnly cookie.
      x-roles:
      - PUBLIC
      x-errors:
      - INVALID_CREDENTIALS
      - ACCOUNT_LOCKED
      - ACCOUNT_DISABLED
      - RATE_LIMITED
      x-business-rules:
      - Username is trimmed and lower-cased before lookup.
      - Unknown user and wrong password both return 401 INVALID_CREDENTIALS after a comparable BCrypt delay (dummy hash check)
        to prevent user enumeration.
      - ACCOUNT_LOCKED / ACCOUNT_DISABLED are returned only when the password is correct.
      - 5 consecutive failures set locked_until = now + 15 min and reset the counter; success resets failed_login_count to
        0 and sets last_login_at.
      - A new refresh-token family is created per login; the family expires after APP_JWT_REFRESH_TOKEN_TTL (default 12 h).
      - When mustChangePassword is true the client must route to the change-password screen; other endpoints return 403 PASSWORD_CHANGE_REQUIRED.
      x-entities:
      - users (R/W)
      - user_roles (R)
      - refresh_tokens (W)
      - audit_events (W)
      x-concurrency: Failed-login counter is updated with a single UPDATE ... SET failed_login_count = failed_login_count
        + 1 statement to avoid lost updates.
      x-audit:
      - AUTH_LOGIN_SUCCEEDED
      - AUTH_LOGIN_FAILED
      - AUTH_ACCOUNT_LOCKED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: dr.perera
              password: DevPassword#2026
      responses:
        '200':
          description: Authenticated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDIifQ.sig
                tokenType: Bearer
                expiresIn: 900
                user:
                  id: 00000000-0000-4000-8000-000000000002
                  username: dr.perera
                  fullName: Dr. Nimal Perera
                  roles:
                  - DOCTOR
                  mustChangePassword: false
                  professionalRegistrationNumber: MC-12345
        '400':
          description: VALIDATION_FAILED; MALFORMED_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    type: https://dms.example/problems/validation-failed
                    title: Validation failed
                    status: 400
                    detail: One or more fields are invalid.
                    instance: /api/v1/auth/login
                    code: VALIDATION_FAILED
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
                    errors:
                    - field: fullName
                      code: NotBlank
                      message: must not be blank
                MALFORMED_REQUEST:
                  summary: Malformed request
                  value:
                    type: https://dms.example/problems/malformed-request
                    title: Malformed request
                    status: 400
                    detail: Request body could not be parsed.
                    instance: /api/v1/auth/login
                    code: MALFORMED_REQUEST
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          description: INVALID_CREDENTIALS; ACCOUNT_LOCKED; ACCOUNT_DISABLED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_CREDENTIALS:
                  summary: Invalid credentials
                  value:
                    type: https://dms.example/problems/invalid-credentials
                    title: Invalid credentials
                    status: 401
                    detail: Username or password is incorrect.
                    instance: /api/v1/auth/login
                    code: INVALID_CREDENTIALS
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
                ACCOUNT_LOCKED:
                  summary: Account temporarily locked
                  value:
                    type: https://dms.example/problems/account-locked
                    title: Account temporarily locked
                    status: 401
                    detail: Account is locked until 2026-10-12T09:15:00Z.
                    instance: /api/v1/auth/login
                    code: ACCOUNT_LOCKED
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
                    lockedUntil: '2026-10-12T09:15:00Z'
                ACCOUNT_DISABLED:
                  summary: Account disabled
                  value:
