                  medicineName: Amlodipine
                  strength: 5 mg
                  dosageForm: TABLET
                  dose: 1 tablet
                  frequency: Once daily (OD) in the morning
                  durationDays: 30
                  quantity: 30
                  quantityUnit: tablets
                  instructions: null
                startedAt: '2026-10-12T03:10:00Z'
                startedBy:
                  id: 00000000-0000-4000-8000-000000000004
                  fullName: Kamal Silva
                cancelledAt: null
                cancelledBy: null
                cancelReason: null
                supersedesPrescriptionId: null
                supersededByPrescriptionId: null
