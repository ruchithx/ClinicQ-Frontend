  /api/v1/auth/change-password:
    post:
      tags:
      - Authentication
      operationId: changePassword
      summary: Change own password
      description: Changes the caller's password, clears mustChangePassword and revokes all of the caller's other refresh-token
        families. The current family stays valid so the user remains logged in.
      x-roles:
      - ANY_STAFF
      x-allowed-when-password-change-required: true
      x-errors:
      - CURRENT_PASSWORD_INCORRECT
      - PASSWORD_POLICY_VIOLATION
      x-business-rules:
      - newPassword must be 12-128 characters, differ from the current password, not contain the username (case-insensitive)
        and not be on the deny-list (top 10 000 common passwords bundled as a resource).
      - Wrong currentPassword returns 422 (not 401) and counts towards the lockout counter.
      x-entities:
      - users (W)
      - refresh_tokens (W)
      - audit_events (W)
      x-audit:
      - AUTH_PASSWORD_CHANGED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: Temp-Password-2026
              newPassword: correct horse battery staple
      responses:
        '204':
          description: Password changed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          description: VALIDATION_FAILED; MALFORMED_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    type: https://dms.example/problems/validation-failed
                    title: Validation failed
                    status: 400
                    detail: One or more fields are invalid.
                    instance: /api/v1/auth/change-password
                    code: VALIDATION_FAILED
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
                    errors:
                    - field: fullName
                      code: NotBlank
                      message: must not be blank
                MALFORMED_REQUEST:
                  summary: Malformed request
                  value:
                    type: https://dms.example/problems/malformed-request
                    title: Malformed request
                    status: 400
                    detail: Request body could not be parsed.
                    instance: /api/v1/auth/change-password
                    code: MALFORMED_REQUEST
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          description: UNAUTHENTICATED; TOKEN_EXPIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                UNAUTHENTICATED:
                  summary: Authentication required
                  value:
                    type: https://dms.example/problems/unauthenticated
                    title: Authentication required
                    status: 401
                    detail: A valid access token is required.
                    instance: /api/v1/auth/change-password
                    code: UNAUTHENTICATED
                    requestId: 0b5e2d4c-6f1a-4e3b-9c7d-2a1f0e9d8c7b
                    timestamp: '2026-10-12T04:30:00Z'
                TOKEN_EXPIRED:
                  summary: Access token expired
                  value:
                    type: https://dms.example/problems/token-expired
                    title: Access token expired
                    status: 401
                    detail: The access token has expired.
