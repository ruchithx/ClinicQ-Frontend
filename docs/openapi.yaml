      - Users and staff
      operationId: updateUser
      summary: Update a staff account (name, roles, enabled, registration number)
      x-roles:
      - ADMIN
      x-errors:
      - USER_NOT_FOUND
      - CONCURRENT_MODIFICATION
      - SELF_MODIFICATION_NOT_ALLOWED
      - LAST_ADMIN_REQUIRED
      x-business-rules:
      - username cannot be changed.
      - Setting enabled = false revokes all refresh-token families of the user (USER_DISABLED); existing access tokens expire
        within 15 min.
      - An admin cannot disable themselves or remove their own ADMIN role.
      - At least one enabled ADMIN must remain.
      - Setting enabled = true also clears locked_until and failed_login_count.
      x-entities:
      - users (W)
      - user_roles (W)
      - refresh_tokens (W)
      - audit_events (W)
      x-concurrency: Optimistic locking on users.version; stale version -> 409 CONCURRENT_MODIFICATION. The last-admin check
        runs with the ADMIN user rows locked (SELECT ... FOR UPDATE) to prevent two admins demoting each other concurrently.
      x-audit:
      - USER_UPDATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              fullName: Kamal Silva
              roles:
              - PHARMACIST
              enabled: false
