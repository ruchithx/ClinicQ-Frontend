    post:
      tags:
      - Patients
      operationId: createPatient
      summary: Register a new patient
      x-roles:
      - DOCTOR
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      x-errors:
      - DUPLICATE_PATIENT_NUMBER
      x-business-rules:
      - patientNumber and phoneNumber are normalised (trim; patientNumber upper-cased; phone spaces/hyphens/parentheses removed)
        before validation and storage.
      - Exactly one of dateOfBirth or estimatedAgeYears must be supplied. With estimatedAgeYears N, the server stores dateOfBirth
        = today(APP_TIMEZONE) - N years and dateOfBirthEstimated = true.
      - dateOfBirth must not be in the future (APP_TIMEZONE) and not before 1900-01-01.
      - patientNumber is immutable after registration.
      - Registration is a separate transaction from the consultation (Workflow B). If the following consultation submission
        fails, the registered patient remains valid and the doctor retries the consultation only.
      x-entities:
      - patients (W)
      - idempotency_keys (W)
      - audit_events (W)
      x-concurrency: uq_patients_patient_number is the final guard against concurrent registrations of the same number; the
        violation is mapped to 409 DUPLICATE_PATIENT_NUMBER with existingPatientId.
      x-audit:
      - PATIENT_CREATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
            examples:
              exactDob:
                summary: Known date of birth
                value:
                  patientNumber: p-0042
                  fullName: Nadeesha Rathnayake
                  sex: FEMALE
                  dateOfBirth: '1996-08-14'
                  phoneNumber: 077 123 4567
                  address: 45 Lake Drive, Colombo 08
                  knownAllergies: Sulfonamides
              estimatedAge:
                summary: Date of birth unknown
                value:
                  patientNumber: P-0043
                  fullName: Unknown elderly male (brought by neighbour)
                  sex: MALE
                  estimatedAgeYears: 75
      responses:
