    UpdatePatientRequest:
      type: object
      required:
      - fullName
      - sex
      - version
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        sex:
          $ref: '#/components/schemas/Sex'
        dateOfBirth:
          type: string
          format: date
          description: Date of birth to store. Send together with dateOfBirthEstimated. Mutually exclusive with estimatedAgeYears.
        dateOfBirthEstimated:
          type: boolean
          description: Send the value received from GET unless the user entered an exact DOB (then false). Required with dateOfBirth.
        estimatedAgeYears:
          type: integer
          minimum: 0
          maximum: 130
          description: Re-estimates the DOB from an age (stores dateOfBirthEstimated = true). Mutually exclusive with dateOfBirth.
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        address:
          type:
          - string
          - 'null'
          maxLength: 300
        knownAllergies:
          type:
          - string
          - 'null'
          maxLength: 1000
        version:
          type: integer
          format: int64
          minimum: 0
      oneOf:
      - required:
        - dateOfBirth
        - dateOfBirthEstimated
      - required:
        - estimatedAgeYears
      additionalProperties: false
