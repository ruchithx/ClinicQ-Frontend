  /api/v1/prescriptions/{prescriptionId}/dispense:
    parameters:
    - $ref: '#/components/parameters/PrescriptionId'
    post:
      tags:
      - Pharmacy and dispensing
      operationId: dispensePrescription
      summary: Confirm dispensing ("Mark as Dispensed") with per-item quantities
      description: |
        Records exactly what was handed over for every prescribed item, the pharmacist and the timestamp, and moves
        the prescription to DISPENSED. Allowed from PENDING or IN_PROGRESS. This is the only way a prescription becomes DISPENSED.
      x-roles:
      - PHARMACIST
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      x-errors:
      - PRESCRIPTION_NOT_FOUND
      - INVALID_STATUS_TRANSITION
      - DISPENSE_ITEMS_MISMATCH
      - DISPENSE_QUANTITY_EXCEEDS_PRESCRIBED
      - NOTHING_DISPENSED
      - DISPENSE_NOTE_REQUIRED
      x-business-rules:
      - items must list every prescription item of this prescription exactly once (by prescriptionItemId).
      - 0 <= quantityDispensed <= prescribed quantity, max 2 decimals.
      - Item status is derived - equal to prescribed = FULL, between = PARTIAL, 0 = NOT_DISPENSED. A note is required for
        PARTIAL and NOT_DISPENSED.
      - At least one item must have quantityDispensed > 0; if nothing can be supplied, cancel the prescription instead.
      - outcome = FULL when all items are FULL, otherwise PARTIAL. Remaining quantities are not tracked for later dispensing
        in v1.
      - pharmacist = authenticated user; dispensedAt = server time.
      - Dispensing is irreversible in v1 (no un-dispense endpoint). Corrections are made by a note in a new consultation/prescription.
      x-entities:
      - prescriptions (W)
      - prescription_items (R)
      - dispensings (W)
      - dispensing_items (W)
      - idempotency_keys (W)
      - audit_events (W)
      x-concurrency: |
        Prescription row locked FOR UPDATE, status re-checked inside the transaction, then dispensing + items inserted and status set.
        uq_dispensings_prescription makes a second dispensing impossible even if application checks were bypassed.
        A double click with the same Idempotency-Key replays the first 200 response; a second pharmacist dispensing concurrently gets 409 INVALID_STATUS_TRANSITION (currentStatus DISPENSED).
      x-audit:
      - PRESCRIPTION_DISPENSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispenseRequest'
            example:
              notes: Counselled on taking Metformin with meals
              items:
              - prescriptionItemId: 51000000-0000-4000-8000-000000000003
                quantityDispensed: 60
              - prescriptionItemId: 51000000-0000-4000-8000-000000000004
                quantityDispensed: 14
                note: Only 14 in stock; patient to collect remainder elsewhere
      responses:
        '200':
          description: Dispensed (or replayed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
