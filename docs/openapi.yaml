  /api/v1/queue-sessions/{queueSessionId}/call-next:
    parameters:
    - $ref: '#/components/parameters/QueueSessionId'
    post:
      tags:
      - Queue management
      operationId: callNextPatient
      summary: Call the next waiting patient (the doctor's "Next patient" button)
      description: |
        Atomically (optionally) completes the entry currently being served and moves the lowest-numbered WAITING entry to SERVING.
        This is the only meaning of the doctor's "increase queue number" button: it advances the serving number. It never creates a booking.
      x-roles:
      - DOCTOR
      x-errors:
      - QUEUE_SESSION_NOT_FOUND
      - QUEUE_SESSION_NOT_OPEN
      - QUEUE_SESSION_CLOSED
      - QUEUE_STATE_CHANGED
      - QUEUE_ENTRY_NOT_IN_SESSION
      - INVALID_STATUS_TRANSITION
      x-business-rules:
      - expectedLastCalledNumber must equal the session's currentServingNumber as last seen by the client (null if nobody
        has been called yet). Mismatch -> 409 QUEUE_STATE_CHANGED with currentServingNumber; nothing changes. This makes double
        clicks and two doctors pressing at once safe - a patient can never be skipped silently.
      - completeCurrentEntryId (optional) must be an entry of this session; if SERVING it becomes COMPLETED, if already COMPLETED
        it is ignored, any other status -> 409 INVALID_STATUS_TRANSITION.
      - The next entry is the WAITING entry with the lowest queueNumber (FIFO; requeued entries keep their original number
        and are therefore called next).
      - If no entry is WAITING the response has calledEntry = null (200); the completion, if requested, is still applied.
      - Session must be OPEN.
      x-entities:
      - queue_sessions (W)
      - queue_entries (W)
      - audit_events (W)
      x-concurrency: |
        One transaction: SELECT session FOR UPDATE -> compare expectedLastCalledNumber -> optional complete -> SELECT lowest WAITING -> UPDATE entry SERVING -> session.last_called_number = number, version += 1.
        Concurrent calls serialise on the session row; the second sees the new last_called_number and fails the compare.
      x-audit:
      - QUEUE_ENTRY_COMPLETED
      - QUEUE_ENTRY_CALLED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallNextRequest'
            example:
              expectedLastCalledNumber: 2
              completeCurrentEntryId: 31000000-0000-4000-8000-000000000002
      responses:
        '200':
          description: Queue advanced (or nothing waiting).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallNextResponse'
              example:
                completedEntry:
                  id: 31000000-0000-4000-8000-000000000002
                  queueNumber: 2
                  status: COMPLETED
                calledEntry:
                  id: 31000000-0000-4000-8000-000000000003
                  queueSessionId: 30000000-0000-4000-8000-000000000001
                  queueNumber: 3
                  status: SERVING
                  channel: PHONE
                  patientName: Ishara Gunasekara (mother calling)
                  contactPhone: 0759876543
                  notes: null
                  bookedAt: '2026-10-12T02:17:31Z'
                  bookedBy:
                    id: 00000000-0000-4000-8000-000000000004
                    fullName: Kamal Silva
                  calledAt: '2026-10-12T04:45:00Z'
                  calledBy:
