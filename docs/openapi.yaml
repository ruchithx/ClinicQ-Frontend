components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256-signed JWT obtained from POST /api/v1/auth/login or /api/v1/auth/refresh.
        Claims: `sub` (user id), `roles` (array), `pwd_change` (boolean, true while a password change is required), `iss` (= APP_JWT_ISSUER), `iat`, `exp`, `jti`. Lifetime 15 minutes.
    refreshCookie:
      type: apiKey
      in: cookie
      name: dms_refresh
      description: |
        Opaque refresh token. Set by login/refresh with attributes
        `HttpOnly; SameSite=Strict; Path=/api/v1/auth; Max-Age=<remaining family lifetime>` and `Secure`
        when APP_REFRESH_COOKIE_SECURE=true. Requests using it must also send `X-Requested-With: XMLHttpRequest`.
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client correlation id (8-64 chars of [A-Za-z0-9-]). Generated by the server when absent and echoed
        in the response and in Problem.requestId.
      schema:
        type: string
        pattern: ^[A-Za-z0-9-]{8,64}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated unique key (UUID v4 recommended) identifying one user intent. The frontend creates it
        when the form is opened/submitted and reuses it for retries of that same submission.
        Same key + same body within 24 h -> original response replayed (same status, current resource state).
        Same key + different body/operation -> 422 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,100}$
      example: 3f6c1a52-8c1e-4f0e-9a1b-6d2f8e0c4b7a
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Must be `XMLHttpRequest`. Cross-site forms cannot set it, which (with SameSite=Strict) protects the cookie-authenticated
        endpoints against CSRF.
      schema:
        type: string
        const: XMLHttpRequest
    PatientId:
      name: patientId
      in: path
      required: true
      description: Patient UUID.
      schema:
        type: string
        format: uuid
    ConsultationId:
      name: consultationId
      in: path
      required: true
      description: Consultation UUID.
      schema:
        type: string
        format: uuid
    PrescriptionId:
      name: prescriptionId
      in: path
      required: true
      description: Prescription UUID.
      schema:
        type: string
        format: uuid
    QueueSessionId:
      name: queueSessionId
      in: path
      required: true
      description: Queue session UUID.
      schema:
        type: string
        format: uuid
    QueueEntryId:
      name: queueEntryId
      in: path
      required: true
      description: Queue entry (booking) UUID.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: User UUID.
      schema:
        type: string
        format: uuid
    MedicineId:
      name: medicineId
      in: path
      required: true
      description: Medicine UUID.
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: Correlation id of the request (echo of the request header or server-generated).
      schema:
        type: string
    ETag:
      description: Weak entity tag of the queue state, `W/"<sessionId>-<version>"`.
      schema:
        type: string
    SetRefreshCookie:
      description: '`dms_refresh=<opaque>; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Max-Age=<seconds>[; Secure]`. Logout
        sends Max-Age=0.'
      schema:
        type: string
    RetryAfter:
      description: Seconds until the client may retry.
      schema:
        type: integer
  schemas:
    AddPrescriptionRequest:
      type: object
      required:
      - items
      properties:
        supersedesPrescriptionId:
          type:
          - string
          - 'null'
          format: uuid
        notes:
          type:
          - string
          - 'null'
          maxLength: 1000
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/PrescriptionItemInput'
      additionalProperties: false
    AuditAction:
      type: string
      description: Audit action recorded in audit_events.action.
      enum:
      - AUTH_LOGIN_SUCCEEDED
      - AUTH_LOGIN_FAILED
      - AUTH_ACCOUNT_LOCKED
      - AUTH_LOGOUT
      - AUTH_REFRESH_REUSE_DETECTED
      - AUTH_PASSWORD_CHANGED
      - ACCESS_DENIED
      - USER_CREATED
      - USER_UPDATED
      - USER_PASSWORD_RESET
      - PATIENT_CREATED
      - PATIENT_UPDATED
      - PATIENT_VIEWED
      - PATIENT_SEARCHED
      - PATIENT_HISTORY_VIEWED
      - CONSULTATION_CREATED
      - CONSULTATION_VIEWED
      - PRESCRIPTION_CREATED
      - PRESCRIPTION_VIEWED
      - PRESCRIPTION_STARTED
      - PRESCRIPTION_DISPENSED
      - PRESCRIPTION_CANCELLED
      - MEDICINE_CREATED
      - MEDICINE_UPDATED
      - QUEUE_SESSION_CREATED
      - QUEUE_SESSION_OPENED
      - QUEUE_SESSION_CLOSED
      - BOOKING_CREATED
      - BOOKING_CANCELLED
      - QUEUE_ENTRY_CALLED
      - QUEUE_ENTRY_COMPLETED
      - QUEUE_ENTRY_SKIPPED
      - QUEUE_ENTRY_REQUEUED
      - AUDIT_LOG_VIEWED
      - RETENTION_JOB_EXECUTED
    AuditActor:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type:
          - string
          - 'null'
      additionalProperties: false
    AuditEventPage:
      type: object
      description: Page of AuditEventResponse.
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
          format: int64
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false
    AuditEventResponse:
      type: object
      required:
      - id
      - occurredAt
      - action
      - entityType
      - outcome
      - details
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          oneOf:
          - $ref: '#/components/schemas/AuditActor'
          - type: 'null'
        action:
          $ref: '#/components/schemas/AuditAction'
        entityType:
          type: string
        entityId:
          type:
          - string
          - 'null'
          format: uuid
        patientId:
          type:
          - string
          - 'null'
          format: uuid
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        details:
          type: object
          additionalProperties: true
        requestId:
          type:
          - string
          - 'null'
        ipAddress:
          type:
          - string
          - 'null'
      additionalProperties: false
    AuditOutcome:
      type: string
      enum:
      - SUCCESS
      - FAILURE
      - DENIED
    BookingChannel:
      type: string
      enum:
      - PHONE
      - WALK_IN
    CallNextRequest:
      type: object
      required:
      - expectedLastCalledNumber
      properties:
        expectedLastCalledNumber:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 999
          description: currentServingNumber the client last saw (null if none).
        completeCurrentEntryId:
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: false
    CallNextResponse:
      type: object
      required:
      - calledEntry
      - completedEntry
      - session
      properties:
        calledEntry:
          oneOf:
          - $ref: '#/components/schemas/QueueEntryResponse'
          - type: 'null'
          description: null when nobody is waiting.
        completedEntry:
          oneOf:
          - $ref: '#/components/schemas/QueueEntryRef'
          - type: 'null'
        session:
          $ref: '#/components/schemas/QueueSessionResponse'
      additionalProperties: false
    CancelBookingRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false
    CancelPrescriptionRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
