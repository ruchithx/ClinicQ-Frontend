  /api/v1/public/queue-sessions/{queueSessionId}:
    parameters:
    - $ref: '#/components/parameters/QueueSessionId'
    get:
      tags:
      - Public queue display
      operationId: getPublicQueueStatus
      summary: Privacy-safe live status of one queue (waiting-room display and patients' phones)
      description: |
        Polled every NEXT_PUBLIC_QUEUE_POLL_INTERVAL_MS (default 5 s). Send If-None-Match with the last ETag;
        an unchanged queue returns 304 with no body.
      x-roles:
      - PUBLIC
      security: []
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: ETag from the previous response.
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
      x-errors:
      - QUEUE_SESSION_NOT_FOUND
      - RATE_LIMITED
      x-business-rules:
      - Only sessions with sessionDate >= today (APP_TIMEZONE) are visible; past sessions -> 404 QUEUE_SESSION_NOT_FOUND.
      - Response is built from a dedicated DTO containing only numbers, counts, status and the session label. It never contains
        patient names, phone numbers, patient numbers, notes, diagnoses, prescriptions or staff names.
      - waitingNumbers lists at most the first 50 waiting numbers in order.
      - ETag = W/"<sessionId>-<session.version>"; Cache-Control - no-cache.
      x-entities:
      - queue_sessions (R)
      - queue_entries (R, numbers only)
      x-concurrency: Read-only; consistent snapshot in one read-only transaction.
      responses:
        '200':
          description: Current queue status.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: no-cache
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQueueStatus'
              example:
                id: 30000000-0000-4000-8000-000000000001
                name: Morning OPD - Room 1
                sessionDate: '2026-10-12'
                status: OPEN
                currentServingNumber: 2
                servingNumbers:
                - 2
                waitingCount: 3
                waitingNumbers:
                - 3
                - 4
                - 5
                lastIssuedNumber: 5
                updatedAt: '2026-10-12T04:27:31Z'
        '304':
          description: Not modified.
