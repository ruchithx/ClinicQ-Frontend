                status: DISPENSED
                notes: Patient allergic to penicillin
                submittedAt: '2026-10-12T03:03:31Z'
                prescribedBy:
                  id: 00000000-0000-4000-8000-000000000002
                  fullName: Dr. Nimal Perera
                patient:
                  id: 20000000-0000-4000-8000-000000000001
                  patientNumber: P-0001
                  fullName: Saman Kumara
                  sex: MALE
                  ageYears: 48
                  dateOfBirthEstimated: false
                  knownAllergies: Penicillin (rash)
                items:
                - id: 51000000-0000-4000-8000-000000000003
                  lineNumber: 1
                  medicineId: 10000000-0000-4000-8000-000000000005
                  medicineName: Metformin
                  strength: 500 mg
                  dosageForm: TABLET
                  dose: 1 tablet
                  frequency: Twice daily (BD)
                  durationDays: 30
                  quantity: 60
                  quantityUnit: tablets
                  instructions: With meals
                - id: 51000000-0000-4000-8000-000000000004
                  lineNumber: 2
