      additionalProperties: false
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details used for every error response (media type application/problem+json).
        `code` is the stable machine-readable value clients switch on; `title` is stable per code; `detail` is human-readable and may vary.
        Context fields (existingPatientId, currentStatus, ...) are present only for the codes that define them.
      required:
      - type
      - title
      - status
      - code
      - requestId
      - timestamp
      properties:
        type:
          type: string
          format: uri
          description: https://dms.example/problems/<code-in-kebab-case>
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: Request path.
        code:
          $ref: '#/components/schemas/ErrorCode'
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: Field-level problems (VALIDATION_FAILED and some 409/422 codes).
          items:
            $ref: '#/components/schemas/FieldError'
        existingPatientId:
          type: string
          format: uuid
          description: DUPLICATE_PATIENT_NUMBER only.
        existingQueueNumber:
          type: integer
          description: DUPLICATE_BOOKING only.
        currentStatus:
          type: string
          description: INVALID_STATUS_TRANSITION only - status of the resource now.
        currentServingNumber:
          type:
          - integer
          - 'null'
          description: QUEUE_STATE_CHANGED only.
        waitingCount:
          type: integer
          description: QUEUE_SESSION_HAS_ACTIVE_ENTRIES only.
        servingCount:
          type: integer
          description: QUEUE_SESSION_HAS_ACTIVE_ENTRIES only.
        lockedUntil:
          type: string
          format: date-time
          description: ACCOUNT_LOCKED only.
        retryAfterSeconds:
          type: integer
          description: RATE_LIMITED only.
      additionalProperties: false
    PublicQueueSessionList:
      type: object
      required:
      - date
      - items
      properties:
        date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicQueueSessionSummary'
      additionalProperties: false
    PublicQueueSessionSummary:
      type: object
