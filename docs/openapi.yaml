    post:
      tags:
      - Queue management
      operationId: createQueueSession
      summary: Create a queue session (e.g. today's clinic for a room/doctor)
      x-roles:
      - DOCTOR
      - PHARMACIST
      x-errors:
      - DUPLICATE_QUEUE_SESSION
      - INVALID_SESSION_DATE
      - ASSIGNED_USER_NOT_DOCTOR
      - REFERENCED_RESOURCE_NOT_FOUND
      x-business-rules:
      - sessionDate must be between today and today + 30 days (APP_TIMEZONE).
      - name is trimmed; unique per date case-insensitively.
      - Created in status SCHEDULED with lastIssuedNumber 0. Bookings are accepted immediately; calling requires opening.
      x-entities:
      - queue_sessions (W)
      - users (R)
      - audit_events (W)
      x-concurrency: uq_queue_sessions_date_name guards concurrent creation; violation -> 409 DUPLICATE_QUEUE_SESSION.
      x-audit:
      - QUEUE_SESSION_CREATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQueueSessionRequest'
            example:
              sessionDate: '2026-10-13'
              name: Evening OPD - Room 2
              assignedDoctorId: 00000000-0000-4000-8000-000000000003
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: /api/v1/queue-sessions/{queueSessionId}
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSessionResponse'
              example:
                id: 30000000-0000-4000-8000-000000000003
                sessionDate: '2026-10-13'
                name: Evening OPD - Room 2
