        currentServingNumber:
          type:
          - integer
          - 'null'
        waitingCount:
          type: integer
          minimum: 0
      additionalProperties: false
    PublicQueueStatus:
      type: object
      description: The ONLY queue representation exposed without authentication. Adding a field requires a privacy review
        (BR-Q-10).
      required:
      - id
      - name
      - sessionDate
      - status
      - currentServingNumber
      - servingNumbers
      - waitingCount
      - waitingNumbers
      - lastIssuedNumber
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sessionDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/QueueSessionStatus'
        currentServingNumber:
          type:
          - integer
          - 'null'
        servingNumbers:
          type: array
          items:
            type: integer
        waitingCount:
          type: integer
          minimum: 0
        waitingNumbers:
          type: array
          maxItems: 50
          items:
            type: integer
        lastIssuedNumber:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    QueueCounts:
      type: object
      required:
      - waiting
      - serving
      - completed
      - skipped
      - cancelled
      properties:
        waiting:
          type: integer
          minimum: 0
        serving:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
      additionalProperties: false
    QueueEntryPage:
