    post:
      tags:
      - Bookings
      operationId: createBooking
      summary: Register a telephone or walk-in booking and assign the next queue number
      x-roles:
      - DOCTOR
      - PHARMACIST
      x-idempotency: required
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      x-errors:
      - QUEUE_SESSION_NOT_FOUND
      - QUEUE_SESSION_CLOSED
      - QUEUE_SESSION_FULL
      - DUPLICATE_BOOKING
      x-business-rules:
      - Allowed while the session is SCHEDULED or OPEN.
      - queueNumber = session.lastIssuedNumber + 1 (1..999). Numbers are never reused, even after cancellation.
      - contactPhone is normalised (spaces, hyphens, parentheses removed). If another WAITING/SERVING entry of the session
        has the same phone and allowDuplicate is not true -> 409 DUPLICATE_BOOKING with existingQueueNumber (staff can confirm,
        e.g. two family members, and resend with allowDuplicate = true and a NEW Idempotency-Key).
      - patientName is what the caller says; it is not linked to a patient record and is never shown publicly. notes must
        not contain clinical information (UI hint).
      x-entities:
      - queue_sessions (W)
      - queue_entries (W)
      - idempotency_keys (W)
      - audit_events (W)
      x-concurrency: |
        One transaction: SELECT session FOR UPDATE -> check status/limit/duplicate -> last_issued_number += 1 -> INSERT entry.
        All bookings of a session serialise on the session row, so numbers are unique and gap-free; a rollback undoes the increment.
        uq_queue_entries_session_number is the database backstop. Retries with the same Idempotency-Key return the original entry (no second number).
      x-audit:
      - BOOKING_CREATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            example:
              patientName: Mrs. Wickramasinghe
              contactPhone: 071-234 5678
              channel: PHONE
              notes: Needs wheelchair access
              allowDuplicate: false
      responses:
        '201':
          description: Booking created; tell the caller the queueNumber.
